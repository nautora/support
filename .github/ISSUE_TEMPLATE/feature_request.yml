name: Feature request
description: Suggest an idea for Nautora
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or pain point.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Nautora to do?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Both
        - iOS / iPadOS
        - Android
